<div class="hc-sort-header-container"
     [class.hc-sort-header-sorted]="_isSorted()"
     [class.hc-sort-header-position-before]="arrowPosition === 'before'">
  <button class="hc-sort-header-button" type="button"
          [attr.disabled]="_isDisabled() || null"
          [attr.aria-label]="_intl.sortButtonLabel(id)"
          (focus)="_setIndicatorHintVisible(true)"
          (blur)="_setIndicatorHintVisible(false)">
    <ng-content></ng-content>
  </button>

  <div class="hc-sort-header-indicator">
    <ng-container *ngIf="_sort.multiSort; else singleSortIcon">
      <ng-container *ngIf="_sort.getSort(id) as sort; else multiSortIcon">
        <div *ngIf="_sort.sorts.length > 1 && sort.priority as priority; else multiSortIcon" class="hc-sort-header-priority">
          <span class="hc-sort-header-priority-icon" [ngClass]="{'hc-sort-header-asc': sort.direction === 'asc', 'hc-sort-header-desc': sort.direction === 'desc'}"></span>
          <span class="hc-sort-header-priority-number">{{priority}}</span>
        </div>
      </ng-container>
    </ng-container>
  </div>
</div>

<ng-template #singleSortIcon>
  <div class="hc-sort-header-icon" [ngClass]="{'hc-sort-header-asc': _getArrowDirectionState() === 'active-asc', 'hc-sort-header-desc': _getArrowDirectionState() === 'active-desc', 'hc-sort-header-off': !_isSorted() }"></div>
</ng-template>

<ng-template #multiSortIcon>
  <div class="hc-sort-header-icon" [ngClass]="{'hc-sort-header-asc': _getArrowDirectionState() === 'active-asc', 'hc-sort-header-desc': _getArrowDirectionState() === 'active-desc', 'hc-sort-header-off': !_isSorted() }"></div>
</ng-template>

<ng-content select="hc-cell-resizer"></ng-content>
