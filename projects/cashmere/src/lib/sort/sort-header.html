<div class="hc-sort-header-container"
     [class.hc-sort-header-sorted]="_isSorted()"
     [class.hc-sort-header-position-before]="arrowPosition === 'before'">
  <button class="hc-sort-header-button" type="button"
          [attr.disabled]="_isDisabled() || null"
          [attr.aria-label]="_intl.sortButtonLabel(id)"
          (focus)="_setIndicatorHintVisible(true)"
          (blur)="_setIndicatorHintVisible(false)">
    <ng-content></ng-content>
  </button>

  <div class="hc-sort-header-indicator">
    <div *ngIf="!_sort.multiSort" class="hc-sort-header-icon" [ngClass]="{'hc-sort-header-asc': _getArrowDirectionState() === 'active-asc', 'hc-sort-header-desc': _getArrowDirectionState() === 'active-desc', 'hc-sort-header-off': !_isSorted() }"></div>
    <div *ngIf="_sort.multiSort">
              <div *ngIf="_getSortPriority() as priority" class="hc-sort-header-priority">
                      <span class="hc-sort-header-priority-icon" [ngClass]="{'hc-sort-header-asc': _sort.getSort(id)?.direction === 'asc', 'hc-sort-header-desc': _sort.getSort(id)?.direction === 'desc'}"></span>
                              <span class="hc-sort-header-priority-number">{{priority}}</span>
                                    </div>
                                          <div *ngIf="!_getSortPriority()" class="hc-sort-header-icon" [ngClass]="{'hc-sort-header-asc': _getArrowDirectionState() === 'active-asc', 'hc-sort-header-desc': _getArrowDirectionState() === 'active-desc', 'hc-sort-header-off': !_isSorted() }"></div>
                                              </div>
                                                </div>
</div>

<ng-content select="hc-cell-resizer"></ng-content>
